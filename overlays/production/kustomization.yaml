# Public deployment on k3s with a Let's Encrypt certificate from cert-manager
# (see README "Public deployment with Let's Encrypt").
#
# Own namespace `millennium-quiz-production`: it can run on the same cluster as
# overlays/local (namespace `millennium-quiz`) without touching its Postgres
# volume, Secrets or Ingress. Everything that names the namespace is handled
# here: the namespace transformer below renames the Namespace and every
# object, DNS_CLUSTER_QUERY is patched, and DATABASE_URL uses the short host
# `postgres`, which resolves inside the pod's own namespace. Use another host
# name than local's (the Ingress hosts must differ).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: millennium-quiz-production

resources:
  - ../../base

images:
  # The image millennium-quiz's CI pushes to GHCR from master: one tag per
  # commit, `sha-<7 characters>` (never moves; do not use `latest`). Set it to
  # a tag that exists and is pullable, see README "Public deployment" step 3.
  - name: millennium-quiz
    newName: ghcr.io/pareiss/millennium-quiz
    newTag: sha-changeme # <- e.g. sha-1a2b3c4

secretGenerator:
  - name: millennium-quiz
    envs:
      - secrets.env
  - name: postgres
    envs:
      - secrets.env

patches:
  - target:
      kind: ConfigMap
      name: millennium-quiz
    patch: |-
      - op: replace
        path: /data/PHX_HOST
        value: quiz.example.com # <- your domain (also in the Ingress below)
      # PHX_SCHEME https / PHX_URL_PORT 443 are the base defaults.
      # The namespace is not the base one (the base value names it).
      - op: replace
        path: /data/DNS_CLUSTER_QUERY
        value: millennium-quiz-headless.millennium-quiz-production.svc.cluster.local
      # The app takes the client address for its rate limits (login, e-mail,
      # game creation) as the 1st entry from the right of X-Forwarded-For.
      # Traefik is the one proxy in front of the app and appends the address
      # it received the connection from, so 1 is right ONLY if that address is
      # the visitor's. On k3s that needs Traefik's Service to keep the source
      # IP (externalTrafficPolicy: Local, cluster/traefik/helmchartconfig.yaml;
      # README explains how to verify). Add 1 for every further proxy or load
      # balancer in front of Traefik (e.g. Cloudflare); a too small value
      # counts proxy addresses, a too large one trusts client-sent headers.
      - op: add
        path: /data/TRUSTED_PROXY_HOPS
        value: "1"
      # Postgres runs in the cluster, without TLS.
      - op: add
        path: /data/DATABASE_SSL
        value: "false"
  - target:
      kind: Ingress
      name: millennium-quiz
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: quiz.example.com # <- your domain
      - op: add
        path: /metadata/annotations
        value:
          # `letsencrypt-staging` first, then `letsencrypt-prod`
          cert-manager.io/cluster-issuer: letsencrypt-staging
      # cert-manager creates and renews this Secret
      - op: add
        path: /spec/tls
        value:
          - hosts:
              - quiz.example.com # <- your domain
            secretName: millennium-quiz-tls
