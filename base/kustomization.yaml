apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: millennium-quiz

labels:
  - pairs:
      app.kubernetes.io/part-of: millennium-quiz
    includeSelectors: false

resources:
  - namespace.yaml
  - postgres/service.yaml
  - postgres/statefulset.yaml
  - app/configmap.yaml
  - app/service.yaml
  - app/service-headless.yaml
  - app/deployment.yaml
  - app/ingress.yaml
